name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    # フォーク経由の pull_request では self-hosted runner で任意コードが走らないようスキップ。
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: void2610/unity-coding-standards/.github/workflows/webgl-build-self-hosted.yml@main
    with:
      unity-version: "6000.3.10f1"
      execute-method: Void2610.UnityTemplate.Editor.CI.CiBuild.BuildWebGL
      runner-labels: '["self-hosted", "macos", "apple-silicon"]'
      nuget-restore-method: Void2610.UnityTemplate.Editor.CI.NuGetRestore.Restore
      cloudflare-project-name: __PROJECT_NAME__
      deploy-branch: ${{ github.head_ref }}
      pr-number: ${{ github.event.pull_request.number }}
      pr-title: ${{ github.event.pull_request.title }}
      pr-url: ${{ github.event.pull_request.html_url }}
      pr-head-sha: ${{ github.event.pull_request.head.sha }}
      # 初回 (opened) と再オープン (reopened) のみ Discord 通知。2 回目以降の push (synchronize) では重複を避けるためスキップ
      notify-discord: ${{ github.event.action == 'opened' || github.event.action == 'reopened' }}
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
