name: WebGL Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: void2610/unity-coding-standards/.github/workflows/webgl-build-github-pages-self-hosted.yml@main
    with:
      unity-version: "6000.3.10f1"
      execute-method: Void2610.UnityTemplate.Editor.CI.CiBuild.BuildWebGL
      runner-labels: '["self-hosted","macos","apple-silicon"]'
      nuget-restore-method: Void2610.UnityTemplate.Editor.CI.NuGetRestore.Restore
      optimize-webgl-build-settings: true
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
